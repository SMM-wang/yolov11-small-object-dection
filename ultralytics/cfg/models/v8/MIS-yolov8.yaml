# Parameters
nc: 10 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale 'n'
  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024] # YOLOv8s summary: 129 layers, 11166560 parameters, 11166544 gradients, 28.8 GFLOPS

backbone:
  # [from, repeats, module, args]
  - [-1, 1, SAC, [64, 3, 2]]         # 0  P1/2
  - [-1, 1, SDA, [128, 2]]           # 1  P2/4
  - [-1, 3, MFE, [128, True]]     # 2
  - [-1, 1, SDA, [256, 2]]           # 3  P3/8
  - [-1, 6, MFE, [256,True]]     # 4
  - [-1, 1, SDA, [512, 2]]           # 5  P4/16
  - [-1, 6, MFE, [512, True]]     # 6
  - [-1, 1, SDA, [1024, 2]]          # 7  P5/32
  - [-1, 3, MFE, [1024, True]]    # 8
  - [-1, 1, SPPF, [1024, 5]]         # 9

head:
  # 上采样 + 融合分支
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11
  - [-1, 3, MFE, [512]]                          # 12  P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14
  - [-1, 3, MFE, [256]]                          # 15  P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 2], 1, Concat, [1]]                    # 17
  - [-1, 3, MFE, [128]]                          # 18  P2 - 128 channels, 160x160

  - [-1, 1, SDA, [128, 2]]                       # 19
  - [[-1, 15], 1, Concat, [1]]                   # 20
  - [-1, 3, MFE, [256]]                          # 21  P3 - 256 channels, 80x80

  - [-1, 1, SDA, [256, 2]]                       # 22
  - [[-1, 12], 1, Concat, [1]]                   # 23
  - [-1, 3, MFE, [512]]                          # 24  P4 - 512 channels, 40x40


  # Detection head (使用融合后的三个尺度特征)
  - [[18, 21, 24], 1,Detect, [nc]]