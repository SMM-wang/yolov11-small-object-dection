# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 20 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
#  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
#  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
#  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
#  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs
#MSALCSP summary: 291 layers, 2,683,566 parameters, 2,683,550 gradients, 8.1 GFLOPs
#MSAL
# YOLO11n backbone
backbone:
 # [from, repeats, module, args]
 - [-1, 1, RFD, [64]] # 0-P1/2
 - [-1, 1, RFD, [128]] # 1-P2/4
 - [-1, 1, SACSP, [256,0.5]]
 - [-1, 1, RFD, [256]] # 3-P3/8
 - [-1, 1, SACSP, [512,0.5]]
 - [-1, 1, RFD, [512]] # 5-P4/16
 - [-1, 1, SACSP, [512, 0.5]]
 - [-1, 1, RFD, [1024]] # 7-P5/32
 - [-1, 1, SACSP, [1024, 0.5]]
 - [-1, 1, SPPF, [1024, 5]] # 9
 - [-1, 2, C2PSA, [1024]] # 10


head:
  # ================= Top-Down Pathway =================
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11: P5 upsample
  - [[-1, 6], 1, Concat, [1]] # 12: cat P5_up + P4
  - [-1, 2, C3k2, [512, False]] # 13: fused P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14: P4 upsample
  - [[-1, 4], 1, Concat, [1]] # 15: cat P4_up + P3
  - [-1, 2, C3k2, [256, False]] # 16: fused P3

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17: P3 upsample
  - [[-1, 2], 1, Concat, [1]] # 18: cat P3_up + P2
  - [-1, 2, C3k2, [128, False]] # 19: fused P2 -> (Output 1: 160x160)

  # ================= Bottom-Up Pathway =================
  - [-1, 1, Conv, [128, 3, 2]] # 20: P2 downsample
  - [[-1, 16], 1, Concat, [1]] # 21: cat P2_down + fused P3
  - [-1, 2, C3k2, [256, False]] # 22: fused P3' -> (Output 2: 80x80)

  - [-1, 1, Conv, [256, 3, 2]] # 23: P3' downsample
  - [[-1, 13], 1, Concat, [1]] # 24: cat P3'_down + fused P4
  - [-1, 2, C3k2, [512, False]] # 25: fused P4' -> (Output 3: 40x40)

  # ================= Detect =================
  - [[19, 22, 25], 1, Detect, [nc]] # 26: Detect [P2(160), P3(80), P4(40)]



