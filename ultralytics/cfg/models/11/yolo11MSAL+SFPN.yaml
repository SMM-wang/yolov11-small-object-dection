##SPN_3,160 80 40
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, MSALCSP, [256,0.5]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, MSALCSP, [512,0.5]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 1, MSALCSP, [512, 0.5]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 1, MSALCSP, [1024, 0.5]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10


head:
  - [ -1, 1, nn.Upsample, [ None, 2,"nearest" ] ]
#  - [ -1, 1, nn.Upsample, [ None, 2,"bilinear",False ] ]
  - [ [ -1, 6 ], 1, Concat, [ 1 ] ] # cat backbone P4
#  - [-1, 2, C3k2, [1024, False]]
  - [ -1, 1, MSALCSP, [ 1024, 0.5 ] ]

  - [[2, 4, 13], 1, SFPN, [128, 3]] # 14
  - [ 14, 1, My_Index, [ 0 ] ]   #160*160
  - [ 14, 1, My_Index, [ 1 ] ] #80*80
  - [ 14, 1, My_Index, [ 2 ] ] #40*40

  - [[15, 16, 17], 1, Detect, [nc]] # 12


