# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 20 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
#  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
#  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
#  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
#  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs
#MSALCSP summary: 291 layers, 2,683,566 parameters, 2,683,550 gradients, 8.1 GFLOPs
#MSAL

#160*160
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4  (160x160)
  - [-1, 2, C3k2, [256, False, 0.25]] # 2-P2 output
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8  (80x80)
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3 output
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16 (40x40)
  - [-1, 2, C3k2, [512, True]] # 6-P4 output
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32 (20x20)
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10-P5 output


head:
  - [-1, 1, nn.Upsample, [None, 2,"nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [1024, False]] # 13 40*40

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 80*80

  - [ -1, 1, nn.Upsample, [ None, 2,"nearest"] ]
  - [ [ -1, 2 ], 1, Concat, [ 1 ] ] # cat backbone
  - [-1, 2, C3k2, [256, False]] # 19 160*160

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat
  - [-1, 2, C3k2, [512, False]] # 22   80*80

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat
  - [-1, 2, C3k2, [1024, True]] # 25 40*40

# ============ ASFF 独立模块区域 ============
  # 语法: [from, repeats, module, args]
  # args: [level_index] -> 0代表最小步长层(P2), 1代表中间(P3), 2代表最大步长(P4)

  # ASFF Level 0 (对应 Layer 19, 160*160)
  - [[19, 22, 25], 1, ASFF, [0]] # Layer 26

  # ASFF Level 1 (对应 Layer 22, 80*80)
  - [[19, 22, 25], 1, ASFF, [1]] # Layer 27

  # ASFF Level 2 (对应 Layer 25, 40*40)
  - [[19, 22, 25], 1, ASFF, [2]] # Layer 28

  # ============ Detect Head ============
  # Detect 接收经过 ASFF 融合后的三个层
  - [[26, 27, 28], 1, Detect, [nc]] # Detect



